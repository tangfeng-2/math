<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>圆的认识 · 互动数学课堂</title>
<style>
:root{--ink:#213f39;--green:#247963;--light:#eaf2e9;--paper:#f7f5ed;--orange:#e69442;--blue:#418bbb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #d6dfd4;color:var(--ink);background:white;border-radius:12px;padding:11px 18px;transition:background .15s,transform .15s}button:hover{background:#edf3e9}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:4px}button:disabled{opacity:.5;cursor:default}.app{max-width:1500px;margin:auto;padding:30px 36px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;letter-spacing:3px;color:#648173;font-weight:700}h1{margin:3px 0 0;font-size:34px;letter-spacing:3px}header p{margin:0;font-size:14px;color:#78877b}.header-actions{display:flex;align-items:center;gap:15px}.badge{font-size:13px;color:#718375}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:26px 0 22px}.tab{padding:14px 8px;font-weight:650;background:#fcfcf8}.tab span{display:inline-grid;place-items:center;background:#ecefe5;color:#7a8879;width:25px;height:25px;border-radius:50%;margin-right:10px;font-size:13px}.tab.active{background:var(--green);color:white;border-color:var(--green);box-shadow:0 5px 12px #24796318}.tab.active span{background:#ffffff26;color:white}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.board{border:1px solid #dce3d6;border-radius:20px;background:#fffefa;overflow:hidden;min-height:540px;position:relative;display:flex;flex-direction:column}.board-head{display:flex;align-items:center;justify-content:space-between;padding:19px 23px;border-bottom:1px solid #e8ebdf;gap:10px}.board-head h2{font-size:19px;margin:0}.hint{font-size:13px;color:#829080}.canvas{flex:1;min-height:430px;position:relative;background-image:linear-gradient(#e3e9df70 1px,transparent 1px),linear-gradient(90deg,#e3e9df70 1px,transparent 1px);background-size:26px 26px;display:flex;align-items:center;justify-content:center}.canvas svg{width:100%;max-height:485px;display:block;touch-action:none;user-select:none}.board-foot{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fdfdf8;border-top:1px solid #e8ebdf;min-height:64px;font-size:14px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px}.aside{display:flex;flex-direction:column;gap:16px}.card{border:1px solid #dce3d6;background:#fffefa;border-radius:18px;padding:22px}.card-label{font-size:12px;letter-spacing:2px;color:#839180;margin-bottom:11px}.card h3{font-size:21px;margin:0 0 12px}.card p{font-size:15px;color:#6f7e70;margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0 2px}.controls button{flex:1;white-space:nowrap;font-size:15px;padding:10px}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#1c6754}.selected{background:var(--light);border-color:var(--green);color:var(--green)}input[type=range]{width:100%;accent-color:var(--green);cursor:pointer;margin:18px 0 8px}.value{font-size:36px;font-weight:650;color:var(--green);letter-spacing:-1px}.unit{font-size:15px;font-weight:400;letter-spacing:0}.scale{display:flex;justify-content:space-between;font-size:12px;color:#8b9787}.note{background:var(--light);border-color:#d7e4d3}.note h3{font-size:15px}.formula{font:500 27px Georgia,serif;color:var(--green);margin:12px 0}.feedback{font-size:15px;margin-top:15px;min-height:24px;color:#247963}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#8b9587;font-size:12px}.nav-small{display:flex;gap:8px}.nav-small button{font-size:13px;padding:7px 14px}svg text{font-family:inherit;fill:var(--ink)}.shapes{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:35px}.shape{height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.shape svg{height:90px;width:110px}.shape.correct{border:2px solid var(--green);background:var(--light)}.question{padding:40px;width:100%;max-width:730px}.question h3{font-size:27px;margin:10px 0 26px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answers button{font-size:20px;padding:20px}.question small{letter-spacing:2px;color:#728471}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#fffef6;border:1px solid #e0c58e;box-shadow:0 8px 30px #213f3918;padding:16px 26px;border-radius:13px;white-space:nowrap}.toast strong{color:#ac7124}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}/* Keep scrolling available except on surfaces used for drawing. */
button{min-height:44px;touch-action:manipulation}
.layout>* , .aside>*{min-width:0}
.canvas svg{touch-action:pan-y pinch-zoom}
#handle,#lineBoard{touch-action:none}
#handle{r:30px}
#reset{flex-shrink:0}
@media(min-width:1500px){.canvas{min-height:510px}}
@media(max-width:1100px){.tab span{display:none}.tab{font-size:15px}.badge{display:none}}
@media(max-width:900px){
  .app{padding:20px}.layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{gap:6px}.board{min-height:0}.canvas{min-height:320px}.card{padding:18px}
}
@media(max-width:600px){
  .app{padding:16px max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  header{gap:12px;align-items:flex-start}header>div:first-child{min-width:0}
  h1{font-size:27px}.eyebrow{font-size:10px;letter-spacing:1px}header p{font-size:13px}
  .header-actions{flex-shrink:0}#fullscreen{font-size:13px;padding:8px 10px}
  .tabs{grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 14px;gap:6px}
  .tab{padding:10px 4px;font-size:14px}.tab:last-child{grid-column:1/-1}
  .board{border-radius:16px}.board-head{padding:14px 16px;display:block}
  .board-head h2{font-size:18px}.hint{display:block;margin-top:4px;font-size:13px}
  .canvas{min-height:0}.canvas>svg{height:auto;aspect-ratio:1;max-height:none}
  .board-foot{padding:12px;align-items:flex-start;font-size:13px;gap:8px}
  .aside{grid-template-columns:minmax(0,1fr)}.aside .note{order:1}
  .card h3{font-size:20px}.card p{font-size:16px}.controls button{min-height:46px}
  input[type=range]{height:36px;margin:8px 0}
  .shapes{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:10px}
  .shape{height:135px;padding:10px;min-width:0}.shape svg{max-width:100%;height:82px}
  .question{padding:22px 16px}.question h3{font-size:22px}
  .answers{gap:10px}.answers button{font-size:16px;padding:14px 8px;overflow-wrap:anywhere}
  .formula{font-size:24px}.bottom{flex-direction:column;gap:12px;align-items:stretch}
  .bottom>span{text-align:center}.nav-small{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nav-small button{font-size:15px;min-height:46px}
  #handle{r:34px}
}
@media(max-width:360px){header{flex-wrap:wrap}.answers{grid-template-columns:1fr}.board-foot{flex-wrap:wrap}}

</style>
</head>
<body>
<div class="app">
<header><div><div class="eyebrow">MATH LAB / 互动数学课堂</div><h1>圆的认识<span style="color:#e6a34e">。</span></h1><p>从生活中发现圆，在动手中理解圆。</p></div><div class="header-actions"><span class="badge">小学数学 · 几何探索</span><button id="fullscreen" title="进入或退出全屏">⛶ 全屏授课</button></div></header>
<nav class="tabs" aria-label="课堂环节"></nav>
<main class="layout"><section class="board"><div class="board-head"><h2 id="title"></h2><span class="hint" id="hint"></span></div><div class="canvas" id="canvas"></div><div class="board-foot"><span id="status" aria-live="polite"></span><button id="reset" style="padding:6px 13px;font-size:13px">↺ 重新探索</button></div></section><aside class="aside" id="aside"></aside></main>
<footer class="bottom"><span>圆的认识 · 点击探索，动手发现 &nbsp; / &nbsp; 支持离线使用</span><div class="nav-small"><button id="prev">← 上一环节</button><button id="next">下一环节 →</button></div></footer>
</div>
<script>
const $=s=>document.querySelector(s), names=['认识圆','圈出圆','折一折','画一画','量一量','挑战一下','读一读，画一画'];
const compactView=window.matchMedia('(max-width:600px)');
const diagramViewBox=()=>compactView.matches?'140 0 450 450':'0 0 730 450';
compactView.addEventListener('change',()=>document.querySelectorAll('#diagram, #lineBoard').forEach(svg=>svg.setAttribute('viewBox',diagramViewBox())));
let page=0, radius=3, angle=-35, showR=true, showD=false, showO=true, folds=0, drawing=0, anim=0, found=new Set(), quiz=0, solved=false, score=0;
const questions=[{q:'圆心决定圆的什么？',a:['大小','位置','颜色','周长'],ok:1,why:'圆心决定圆的位置，半径决定圆的大小。'},{q:'一个圆的半径是 3 厘米，它的直径是多少？',a:['3 厘米','1.5 厘米','6 厘米','9 厘米'],ok:2,why:'同一个圆中，直径是半径的 2 倍：3 × 2 = 6 厘米。'},{q:'在同一个圆中，所有半径的长度……',a:['都相等','不一定相等','越往右越长','等于直径'],ok:0,why:'连接圆心和圆上任意一点的线段都是半径，长度都相等。'},{q:'圆有多少条对称轴？',a:['1 条','2 条','4 条','无数条'],ok:3,why:'任意一条直径所在的直线都是圆的对称轴。'},{q:'画一个直径 8 厘米的圆，圆规两脚间距离应为多少？',a:['8 厘米','16 厘米','4 厘米','2 厘米'],ok:2,why:'圆规两脚间的距离是半径：8 ÷ 2 = 4 厘米。'}];
const card=(label,title,body,cls='')=>`<div class="card ${cls}"><div class="card-label">${label}</div><h3>${title}</h3>${body}</div>`;
const btn=(id,label,cls='')=>`<button id="${id}" class="${cls}">${label}</button>`;
function status(t){$('#status').innerHTML='<i class="dot"></i>'+t}
function start(n){cancelAnimationFrame(anim);page=n;radius=3;angle=-35;showR=true;showD=false;showO=true;folds=0;drawing=0;found.clear();quiz=0;score=0;solved=false;segments=[];draft=null;linePointer=null;render()}
function render(){
$('.tabs').innerHTML=names.map((n,i)=>`<button class="tab ${i===page?'active':''}" aria-current="${i===page?'step':'false'}" data-page="${i}"><span>${i+1}</span>${n}</button>`).join('');
$('.tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>start(+b.dataset.page));$('#prev').disabled=page===0;$('#next').disabled=page===names.length-1;
$('#title').textContent=['01 / 和圆交个朋友','02 / 生活中的圆','03 / 对折，发现圆的秘密','04 / 用圆规画一个圆','05 / 半径与直径的关系','06 / 小小圆形探究家','07 / 读一读，画一画'][page];
$('#hint').textContent=['拖动圆上的橙色点，观察半径','点击所有圆形','点击对折，观察重合','调整开口，再转动圆规','改变半径，观察直径','想一想，再选一选','按住拖动画线 · 最多两条'][page];
if(page===6){renderLines();return}if(page===1){renderShapes();return}if(page===5){renderQuiz();return}
let content='';
if(page===0){content=card('认识它的名字','圆的三个好朋友','<p>点击按钮显示或隐藏，再拖动橙色点，看看什么发生了变化。</p><div class="controls">'+btn('o','圆心 O','selected')+btn('r','半径 r','selected')+btn('d','直径 d')+'</div><div class="controls">'+btn('rotate','↻ 换个方向')+'</div>')+card('一起发现','什么是圆？','<p>平面内，到一个固定点的距离等于固定长度的所有点组成的图形，叫作圆。</p><p><b>圆心</b>决定位置，<b>半径</b>决定大小。</p>','note');status('拖动橙色点：方向变了，半径的长度变了吗？')}
if(page===2){content=card('动手实验','把圆对折','<p>沿虚线将圆对折，观察两边是否完全重合。展开后，再换一个方向试试。</p><div class="controls">'+btn('fold','对折演示','primary')+btn('unfold','展开 / 换方向')+'</div><div class="feedback" id="foldmsg">已留下 0 条折痕</div>')+card('思考一下','折痕经过哪里？','<p>每条折痕都经过圆心。</p><p>每条直径所在的直线都是圆的对称轴，圆有<b>无数条对称轴</b>。</p>','note');status('折痕是直径所在的线；多条折痕相交于圆心。')}
if(page===3||page===4){content=card(page===3?'圆规工具箱':'测量实验室',page===3?'先定点，再定长':'半径变了，直径呢？',`<p>${page===3?'① 固定圆心　② 调整开口<br>③ 旋转圆规，画出一周':'拖动滑块，比较两条线段的长度。'}</p><label for="radius">${page===3?'圆规开口':'半径'} r</label><div class="value"><span id="rval">${radius.toFixed(1)}</span> <span class="unit">厘米</span></div><input id="radius" type="range" min="1" max="4" step="0.5" value="${radius}" aria-label="半径，厘米"><div class="scale"><span>1 cm</span><span>4 cm</span></div>${page===3?'<div class="controls">'+btn('draw','▶ 自动画圆','primary')+'</div><p id="progress">准备就绪 · 0%</p>':'<div class="formula" id="dval">d = 6.0 cm</div>'}`)+card('课堂发现',page===3?'圆规开口就是半径':'同一个圆中',page===3?'<p>针尖所在的位置是<b>圆心</b>，两脚之间的距离是<b>半径</b>。</p><p>画圆时，要保持开口大小不变。</p>':'<div class="formula">d = 2r &nbsp; · &nbsp; r = d ÷ 2</div><p>直径经过圆心，两端都在圆上；一条直径的长度等于两条半径的长度之和。</p>','note');status(page===3?'屏幕上的厘米为示意单位，不代表实际屏幕尺寸。':'蓝色是直径，橙色是半径。厘米为示意单位。')}
$('#aside').innerHTML=content;paint();
if(page===0){$('#rotate').onclick=()=>{angle+=30;paint()};[['o','O'],['r','R'],['d','D']].forEach(([id,type])=>$('#'+id).onclick=()=>{if(type==='O')showO=!showO;if(type==='R')showR=!showR;if(type==='D')showD=!showD;$('#'+id).classList.toggle('selected');paint()})}
if(page===2){$('#fold').onclick=fold;$('#unfold').onclick=()=>{cancelAnimationFrame(anim);angle+=35;paint();$('#fold').disabled=false}}
if(page===3||page===4){$('#radius').oninput=e=>{cancelAnimationFrame(anim);radius=+e.target.value;drawing=0;$('#rval').textContent=radius.toFixed(1);if(page===3){$('#draw').disabled=false;$('#progress').textContent='准备就绪 · 0%'}else $('#dval').textContent=`d = ${(2*radius).toFixed(1)} cm`;paint()};if(page===3)$('#draw').onclick=draw}
}
function paint(foldScale=1, keepSvg=false){
const R=radius*45,cx=365,cy=220,a=angle*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),x2=2*cx-x,y2=2*cy-y;
let s='<svg id="diagram" viewBox="'+diagramViewBox()+'" role="img" aria-label="圆的互动示意图"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bdd7c3" stroke-width="2"/></pattern></defs>';
if(page===3){s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#dce6da" stroke-width="2" stroke-dasharray="5 7"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#418bbb" stroke-width="4" stroke-dasharray="${2*Math.PI*R}" stroke-dashoffset="${2*Math.PI*R*(1-drawing)}" transform="rotate(-90 ${cx} ${cy})"/>`;const da=drawing*2*Math.PI-Math.PI/2,px=cx+R*Math.cos(da),py=cy+R*Math.sin(da),hx=(cx+px)/2-30,hy=(cy+py)/2-55;s+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#e2a15b" stroke-dasharray="6 5" stroke-width="2"/><path d="M ${cx} ${cy} L ${hx} ${hy} L ${px} ${py}" fill="none" stroke="#bdc9cb" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M ${hx} ${hy-6} l -7 -24" stroke="#ce944d" stroke-width="12" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="9" fill="#fff8e4" stroke="#ce944d" stroke-width="3"/><circle cx="${px}" cy="${py}" r="5" fill="#418bbb"/><text x="${cx+20}" y="${cy+30}" font-size="18">r = ${radius.toFixed(1)} cm</text>`}
else if(page===2){s+=`<g transform="rotate(${angle} ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#edf3dc" stroke="#98b5a1" stroke-width="2"/><path d="M ${cx} ${cy-R} A ${R} ${R} 0 0 0 ${cx} ${cy+R} Z" fill="#dceac6"/><g transform="translate(${cx} 0) scale(${foldScale} 1) translate(${-cx} 0)"><path d="M ${cx} ${cy-R} A ${R} ${R} 0 0 1 ${cx} ${cy+R} Z" fill="#bdd7a7" fill-opacity=".8" stroke="#67906e" stroke-width="2"/></g><line x1="${cx}" y1="${cy-R-25}" x2="${cx}" y2="${cy+R+25}" stroke="#c68740" stroke-width="2" stroke-dasharray="7 6"/></g>`;for(let i=0;i<folds;i++){let f=(-35+i*35)*Math.PI/180;s+=`<line x1="${cx-R*Math.sin(f)}" y1="${cy+R*Math.cos(f)}" x2="${cx+R*Math.sin(f)}" y2="${cy-R*Math.cos(f)}" stroke="#8aaa81" stroke-width="1.5" stroke-dasharray="4 4"/>`}}
else{s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#eaf3eb65" stroke="#418bbb" stroke-width="3.5"/>`;if(showD||page===4)s+=`<line x1="${page===4?cx-R:x2}" y1="${page===4?cy:y2}" x2="${page===4?cx+R:x}" y2="${page===4?cy:y}" stroke="#418bbb" stroke-width="4"/><text x="${cx-40}" y="${page===4?cy+35:cy+70}" font-size="20" style="fill:#418bbb">d${page===4?' = '+(radius*2).toFixed(1)+' cm':''}</text>`;if(showR||page===4)s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#df9848" stroke-width="4"/><text x="${(cx+x)/2-15}" y="${(cy+y)/2-16}" font-size="20" style="fill:#ba7934">r${page===4?' = '+radius.toFixed(1):''}</text>`;s+=`<circle id="handle" cx="${x}" cy="${y}" r="17" fill="transparent" style="cursor:grab"/><circle cx="${x}" cy="${y}" r="7" fill="#e3a04f" stroke="white" stroke-width="3" pointer-events="none"/>`}
if(showO||page!==0)s+=`<circle cx="${cx}" cy="${cy}" r="5" fill="#247963"/><text x="${cx-25}" y="${cy+27}" font-size="19">O</text>`;
s+='<text x="365" y="425" text-anchor="middle" font-size="13" style="fill:#83917e">'+(page===2?'想一想：换个方向对折，还会完全重合吗？':page===3?'定点 · 定长 · 旋转一周':page===4?'同一个圆内，直径的长度始终是半径的 2 倍':'圆心 O　·　半径 r　·　直径 d')+'</text></svg>';
if(keepSvg){$('#diagram').innerHTML=s.slice(s.indexOf('>')+1,-6);return;}
$('#canvas').innerHTML=s;if((page===0||page===4)&&$('#handle')){$('#handle').onpointerdown=e=>{e.preventDefault();const svg=$('#diagram');svg.setPointerCapture(e.pointerId);svg.onpointermove=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());angle=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;paint(1,true)};svg.onpointerup=()=>{svg.onpointermove=null;paint()};svg.onpointercancel=()=>{svg.onpointermove=null;paint()}}}

}
function draw(){cancelAnimationFrame(anim);$('#draw').disabled=true;const t=performance.now();function frame(now){drawing=Math.min(1,(now-t)/2200);paint();$('#progress').textContent=`正在画圆 · ${Math.round(drawing*100)}%`;if(drawing<1)anim=requestAnimationFrame(frame);else{$('#draw').disabled=false;$('#progress').textContent='完成 · 100%';status(`画好了！这是一个半径 ${radius.toFixed(1)} 厘米、直径 ${(radius*2).toFixed(1)} 厘米的圆。`)}}anim=requestAnimationFrame(frame)}
function fold(){cancelAnimationFrame(anim);$('#fold').disabled=true;const t=performance.now();function frame(now){let p=Math.min(1,(now-t)/1000);paint(Math.cos(p*Math.PI));if(p<1)anim=requestAnimationFrame(frame);else{folds=Math.min(folds+1,12);$('#foldmsg').textContent=`两边完全重合！已演示 ${folds} 次对折`;status('两边完全重合。点击“展开 / 换方向”继续探索。')}}anim=requestAnimationFrame(frame)}
// This drawing board uses a fixed 5 cm radius: 34 SVG units per teaching centimetre.
const lineCircle={x:365,y:220,r:170}, lineColors=['#b13c50','#397fa9'];
let segments=[], draft=null, linePointer=null, keyboardPoint={x:365,y:220};
function snapLinePoint(p,tolerance=12){
  const c=lineCircle, dx=p.x-c.x, dy=p.y-c.y, distance=Math.hypot(dx,dy);
  if(distance<tolerance)return {x:c.x,y:c.y};
  if(distance>c.r-tolerance)return {x:c.x+dx*c.r/distance,y:c.y+dy*c.r/distance};
  return {x:p.x,y:p.y};
}
function lineLength(line){return Math.hypot(line.b.x-line.a.x,line.b.y-line.a.y)/34}
function finishLine(){
  if(draft&&segments.length<2&&lineLength(draft)>=0.1)segments.push(draft);
  draft=null;
}
function renderLines(){
  keyboardPoint={x:365,y:220};
  $('#canvas').innerHTML=`<svg id="lineBoard" viewBox="${diagramViewBox()}" tabindex="0" role="group" aria-label="画线区域：方向键移动光标，回车确定起点和终点，Escape 取消" style="cursor:crosshair">
  <circle cx="365" cy="220" r="170" fill="#fafcf6" stroke="#91ada6" stroke-width="2"/>
  <g id="lineStrokes"></g><circle cx="365" cy="220" r="5" fill="#247963"/><text x="344" y="245" font-size="19">O</text>
  <g id="lineCursor" visibility="hidden" pointer-events="none"><circle r="10" fill="none" stroke="#247963" stroke-width="2"/><path d="M-15 0H15 M0-15V15" stroke="#247963"/></g>
  <text x="365" y="430" text-anchor="middle" font-size="13" style="fill:#6f7e70">本圆半径为 5 cm · 长度为教学示意值</text></svg>`;
  $('#aside').innerHTML=card('读一读','圆心、半径与直径','<p><b>圆心：</b>圆规针尖固定的一点，通常用字母 O 表示。</p><p><b>半径：</b>连接圆心和圆上任意一点的线段，通常用字母 r 表示。</p><p><b>直径：</b>通过圆心并且两端都在圆上的线段，通常用字母 d 表示。</p>','note')+
    card('画一画','线段长度','<div id="lineLengths" aria-live="polite"></div><div class="controls">'+btn('undoLine','撤销上一条')+btn('clearLines','清除画面')+'</div><p>试着画一条半径和一条直径，并比较长度。</p><p>也可用键盘：点选画布后，方向键移动，回车选择起点和终点，Esc 取消。</p>');
  const svg=$('#lineBoard');
  const point=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  svg.onpointerdown=e=>{
    if(e.button!==0||linePointer!==null)return;
    if(segments.length===2){status('已画两条，请先撤销或清除画面。');return}
    const p=point(e);
    if(Math.hypot(p.x-365,p.y-220)>170+(e.pointerType==='touch'?24:12))return;
    e.preventDefault();svg.focus({preventScroll:true});linePointer=e.pointerId;svg.setPointerCapture(e.pointerId);
    const a=snapLinePoint(p,e.pointerType==='touch'?24:12);draft={a,b:a};paintLines();
  };
  svg.onpointermove=e=>{if(linePointer!==e.pointerId||!draft)return;draft.b=snapLinePoint(point(e),e.pointerType==='touch'?24:12);paintLines()};
  svg.onpointerup=e=>{if(linePointer!==e.pointerId)return;draft.b=snapLinePoint(point(e),e.pointerType==='touch'?24:12);finishLine();linePointer=null;svg.releasePointerCapture(e.pointerId);paintLines()};
  const cancel=()=>{draft=null;linePointer=null;paintLines()};
  svg.onpointercancel=e=>{if(linePointer===e.pointerId)cancel()};svg.onlostpointercapture=()=>{if(linePointer!==null)cancel()};
  svg.onkeydown=e=>{
    if(linePointer!==null)return;
    const moves={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,-5],ArrowDown:[0,5]};
    if(moves[e.key]){e.preventDefault();const [dx,dy]=moves[e.key];const p={x:keyboardPoint.x+dx,y:keyboardPoint.y+dy};const d=Math.hypot(p.x-365,p.y-220);keyboardPoint=d>170?{x:365+(p.x-365)*170/d,y:220+(p.y-220)*170/d}:p;if(draft)draft.b=snapLinePoint(keyboardPoint);paintLines();$('#lineCursor').setAttribute('visibility','visible');$('#lineCursor').setAttribute('transform',`translate(${keyboardPoint.x} ${keyboardPoint.y})`)}
    if(e.key==='Enter'||e.key===' '){e.preventDefault();if(draft)finishLine();else if(segments.length<2){const a=snapLinePoint(keyboardPoint);draft={a,b:a}}paintLines()}
    if(e.key==='Escape'){e.preventDefault();cancel()}
  };
  $('#undoLine').onclick=()=>{if(!draft)segments.pop();draft=null;linePointer=null;paintLines()};
  $('#clearLines').onclick=()=>{draft=null;linePointer=null;segments=[];paintLines()};
  paintLines();
}
function paintLines(){
  const lines=draft?[...segments,draft]:segments;
  $('#lineStrokes').innerHTML=lines.map(({a,b},i)=>`<g stroke="${lineColors[i]}" stroke-width="3" ${i===segments.length?'opacity=".65"':''}>
    <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>
    <circle cx="${a.x}" cy="${a.y}" r="5" fill="white"/><circle cx="${b.x}" cy="${b.y}" r="5" fill="white"/>
    <circle cx="${(a.x+b.x)/2}" cy="${(a.y+b.y)/2}" r="13" fill="${lineColors[i]}" stroke="white"/>
    <text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2+5}" text-anchor="middle" stroke="none" style="fill:white" font-size="15">${i+1}</text></g>`).join('');
  $('#lineLengths').innerHTML=`<p>共 ${segments.length} 条${draft?' · 正在绘制':''}</p>`+lines.map((line,i)=>`<p style="color:${lineColors[i]};font-size:21px"><b>❶</b> 线段 ${i+1}：<b>${lineLength(line).toFixed(1)} cm</b></p>`.replace('❶',i===0?'①':'②')).join('')+(lines.length?'':'<p>在圆内按住并拖动，即可画线。</p>');
  $('#undoLine').disabled=segments.length===0&&!draft;$('#clearLines').disabled=segments.length===0&&!draft;
  status(segments.length===2?'已画两条：比较它们的长度，判断哪条是半径或直径。':'靠近圆心 O 或圆周会自动吸附；最多画两条线段。');
}
function renderShapes(){const shapes=[['钟面',true,'<circle cx="55" cy="45" r="36"/><path d="M55 18 V45 L73 57" fill="none"/>'],['窗框',false,'<rect x="20" y="10" width="70" height="70" rx="2"/><path d="M55 10 V80 M20 45 H90"/>'],['盘沿',true,'<circle cx="55" cy="45" r="36"/><circle cx="55" cy="45" r="27" fill="none"/>'],['椭圆镜框',false,'<ellipse cx="55" cy="45" rx="42" ry="29"/>'],['车轮边缘',true,'<circle cx="55" cy="45" r="36"/><circle cx="55" cy="45" r="5"/><path d="M55 9 V81 M19 45 H91 M30 20 L80 70 M30 70 L80 20"/>'],['三角路牌',false,'<path d="M55 9 L96 80 H14 Z"/>']];$('#canvas').innerHTML='<div class="shapes">'+shapes.map(([n,ok,s],i)=>`<button class="shape" data-i="${i}" aria-label="选择${n}"><svg viewBox="0 0 110 90" aria-hidden="true"><g fill="#edf2dd" stroke="#739779" stroke-width="3" stroke-linejoin="round">${s}</g></svg><span>${n}</span></button>`).join('')+'</div>';$('#aside').innerHTML=card('观察生活','哪些轮廓是圆？','<p>点击左侧所有圆形轮廓，看看你能找到几个。</p><div class="value" id="count">0 <span class="unit">/ 3 个</span></div><div class="feedback" id="shapeMsg" aria-live="polite">准备好了吗？开始找圆吧。</div>')+card('观察提示','圆圆的，有什么特点？','<p>圆的边界是一条封闭的曲线，没有角。</p><p>椭圆也没有角，但它不是圆：它的边界到中心的距离不都相等。</p>','note');status('关注物体的圆形轮廓。');document.querySelectorAll('.shape').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(shapes[i][1]){found.add(i);b.classList.add('correct');b.setAttribute('aria-pressed','true');$('#count').innerHTML=found.size+' <span class="unit">/ 3 个</span>';$('#shapeMsg').textContent=found.size===3?'全部找到了！你有一双善于观察的眼睛。':'找对了！继续寻找其他圆形。'}else $('#shapeMsg').textContent='再观察一下：它的边界到中心的距离都相等吗？'})}
function renderQuiz(){const q=questions[quiz];$('#canvas').innerHTML=`<div class="question"><small>想一想 · 第 ${quiz+1} / ${questions.length} 题</small><h3>${q.q}</h3><div class="answers">${q.a.map((a,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div class="feedback" id="answerMsg" aria-live="polite"></div></div>`;$('#aside').innerHTML=card('知识小挑战','把发现变成知识',`<p>每题可以继续尝试。答对后，点击下一题。</p><div class="value">${score} <span class="unit">/ ${questions.length} 题已掌握</span></div><div class="controls">${btn('nextQ',quiz===4?'查看结果':'下一题 →','primary')}</div>`)+card('小贴士','先思考，再点击','<p>可以随时返回前面的环节，动手验证你的想法。</p><p>说一说：你为什么选择这个答案？</p>','note');$('#nextQ').disabled=true;status('不着急，说出理由和选对答案一样重要。');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(solved)return;const correct=+b.dataset.answer===q.ok;$('#answerMsg').textContent=correct?'✓ 答对了！'+q.why:'再想一想，还可以继续尝试。';if(correct){solved=true;score++;b.classList.add('selected');$('#nextQ').disabled=false;$('#aside .value').innerHTML=score+' <span class="unit">/ 5 题已掌握</span>'}});$('#nextQ').onclick=()=>{if(quiz<4){quiz++;solved=false;renderQuiz()}else{$('#canvas').innerHTML='<div class="question" style="text-align:center"><div style="font-size:60px;color:#e1a145">✦</div><small>探索完成</small><h3>你已经掌握了圆的秘密！</h3><p>圆心决定位置，半径决定大小。<br>同一个圆中，d = 2r。<br>圆有无数条对称轴。</p>'+btn('again','再挑战一次','primary')+'</div>';$('#again').onclick=()=>start(5);$('#nextQ').disabled=true;status('课堂小任务：用圆规画一个半径 3 厘米的圆，并标出圆心、半径和直径。')}}}
$('#reset').onclick=()=>start(page);$('#prev').onclick=()=>start(Math.max(0,page-1));$('#next').onclick=()=>start(Math.min(names.length-1,page+1));$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{status('当前浏览器不支持全屏，请使用浏览器的全屏菜单。')}};document.addEventListener('fullscreenchange',()=>$('#fullscreen').textContent=document.fullscreenElement?'⛶ 退出全屏':'⛶ 全屏授课');start(0);
</script>
</body>
</html>
